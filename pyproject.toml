[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tubebench"
version = "0.1.0"
description = "A benchmark for disturbance-free operational YouTube browser use"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TubeBench Contributors"}]

[project.scripts]
tubebench = "tubebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
