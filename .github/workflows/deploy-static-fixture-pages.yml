name: Deploy static CodexTubeBench fixture

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: codextubebench-static-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static fixture artifact
        env:
          DEPLOYMENT_ID: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p _site
          cp -R docs/static-fixture/. _site/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "benchmark_git_revision": os.environ["GITHUB_SHA"],
              "benchmark_git_dirty": False,
              "deployment_id": os.environ["DEPLOYMENT_ID"],
          }
          Path("_site/deployment-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
