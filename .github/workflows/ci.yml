name: Validate TubeBench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run public validation
        run: make test validate release-check

      - name: Validate compiled paper provenance
        run: python3 scripts/validate_paper_artifact.py
